<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Duskline</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{ --ink:#14171C; --amber:#F0A84E; --fog:#F2EFE8; --muted:#8D95A3; }
  @media (prefers-color-scheme: light){
    :root{ --ink:#F4F1EA; --amber:#C9821F; --fog:#211B12; --muted:#7A7263; }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--ink);color:var(--fog);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--amber) 40%,rgba(240,168,78,0) 75%);margin-bottom:22px;}
  h1{font-size:64px;margin:0;font-weight:700;color:var(--amber);}
  p{color:var(--muted);font-size:16px;margin:10px 0 26px;}
  a.btn{display:inline-block;background:var(--amber);color:#191308;text-decoration:none;font-weight:600;
    padding:11px 22px;border-radius:9px;font-size:14.5px;}
</style>
</head>
<body>
  <div class="dot"></div>
  <h1>404</h1>
  <p>That page doesn't exist, or the light doesn't reach that far.</p>
  <a class="btn" href="/">Back to Duskline</a>
</body>
</html>
